<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" rx="20" fill="#000000"/>
  
  <!-- QR Text -->
  <text x="100" y="120" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" text-anchor="middle">QR</text>
  
  <!-- Subtitle -->
  <text x="100" y="150" font-family="Arial, sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle" opacity="0.8">Kan</text>
  
  <!-- Decorative QR-like squares -->
  <rect x="30" y="30" width="20" height="20" rx="3" fill="#FFFFFF"/>
  <rect x="150" y="30" width="20" height="20" rx="3" fill="#FFFFFF"/>
  <rect x="30" y="150" width="20" height="20" rx="3" fill="#FFFFFF"/>
</svg>

